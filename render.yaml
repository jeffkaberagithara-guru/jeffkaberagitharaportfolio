services:
  - type: web
    name: jeff-kabera-portfolio
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kabera-portfolio.onrender.com
