services:
  - type: web
    name: jeffkaberagitharaportfolio
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jeffkaberagitharaportfolio.vercel.app
